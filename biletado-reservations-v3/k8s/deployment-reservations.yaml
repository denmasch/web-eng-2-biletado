apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservations-backend
  labels:
    app: reservations-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservations-backend
  template:
    metadata:
      labels:
        app: reservations-backend
    spec:
      containers:
        - name: reservations
          image: biletado/reservations:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5207
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:5207"
---
apiVersion: v1
kind: Service
metadata:
  name: reservations-service
spec:
  type: NodePort
  selector:
    app: reservations-backend
  ports:
    - port: 5207
      targetPort: 5207
      protocol: TCP
      nodePort: 30520

