name: CI/CD - reservations (Docker only)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # --- Checkout repo ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- Docker Buildx setup ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # --- Log in to GHCR ---
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build & push REST API backend image ---
      - name: Build and push REST API backend image
        uses: docker/build-push-action@v4
        with:
          context: ./biletado-reservations-v3
          file: ./biletado-reservations-v3/Dockerfile
          push: true
          tags: ghcr.io/denmasch/web-eng-2-biletado/biletado-reservations-v3:${{ github.sha }}
          platforms: linux/amd64
